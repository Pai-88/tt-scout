[project]
name = "tt-scout"
version = "0.3.0"
description = "Table tennis match analysis from one phone video: points, winners, 3D shot speeds, posture and a report with clips. Runs offline."
requires-python = ">=3.10"
dependencies = ["opencv-python>=4.8", "numpy>=1.24", "matplotlib>=3.7", "pillow>=10"]
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Paing Hein Htet"}]

[project.optional-dependencies]
ml = ["torch>=2.1"]

[project.scripts]
tt-scout = "tt_scout.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["tt_scout*"]

[tool.setuptools.package-data]
tt_scout = ["*.json", "*.html"]
